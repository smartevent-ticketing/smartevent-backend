server:
  port: 8080

spring:
  config:
    import:
      - optional:classpath:application-jwt.yml


  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        concurrency: ${APP_NOTIFICATION_CONSUMERS:1}
        max-concurrency: ${APP_NOTIFICATION_MAX_CONSUMERS:2}
        prefetch: ${APP_NOTIFICATION_PREFETCH:5}
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2
        default-requeue-rejected: false

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  docs:
    public: ${APP_DOCS_PUBLIC:false}
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
      ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
      version: "2.1.0"
      command: "pay"
  storage:
    minio:
      endpoint: ${APP_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${APP_MINIO_ACCESS_KEY}
      secret-key: ${APP_MINIO_SECRET_KEY}
      bucket: ${APP_MINIO_BUCKET:smart-event}
  date:
    default-format: "yyyy-MM-dd HH:mm:ss"
    timezone: "Asia/Ho_Chi_Minh"

