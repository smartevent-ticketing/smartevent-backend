spring:
  application:
    name: smart-event-ticketing-test
  datasource:
    # Tests must never inherit the developer's application database variables.
    url: jdbc:tc:postgresql:16-alpine:///smart_event_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    listener:
      simple:
        retry:
          enabled: false
        default-requeue-rejected: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: smart-event-test

management:
  health:
    mail:
      enabled: false
