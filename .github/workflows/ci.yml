name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, PostgreSQL integration tests, and package
        run: |
          chmod +x ./gradlew
          ./gradlew clean test postgresTest bootJar --no-daemon
      - name: Build backend image
        run: docker build --tag smartevent-backend:ci .
      - name: Save test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
